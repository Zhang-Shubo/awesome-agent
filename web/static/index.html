<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>agent 面板</title>
<style>
  :root {
    --bg: #eef0f5; --text: #14171c; --muted: #46505c; --accent: #4338ca;
    /* 文字在裸背景上的可读性光晕(亮色用白晕) */
    --halo: 0 1px 2px rgba(255, 255, 255, 0.55);
    /* 液态玻璃材质:文字密集卡片 alpha ≥ 0.55,保证 WCAG 对比度 */
    --glass: rgba(255, 255, 255, 0.6);
    --glass-strong: rgba(255, 255, 255, 0.72);
    --glass-border: rgba(255, 255, 255, 0.65);
    --glass-highlight: rgba(255, 255, 255, 0.9);
    --glass-shadow: rgba(31, 38, 65, 0.12);
    --code-bg: rgba(255, 255, 255, 0.5);
    --ok: #15803d; --ok-bg: rgba(34, 197, 94, .16);
    --pause: #b45309; --pause-bg: rgba(245, 158, 11, .18);
    --arch: #55606e; --arch-bg: rgba(120, 130, 145, .16);
    --blob-a: #c7d2fe; --blob-b: #fbcfe8; --blob-c: #a5f3fc; --blob-d: #ddd6fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e14; --text: #f1f4f8; --muted: #b3bcc8; --accent: #b4c0fe;
      --halo: 0 1px 3px rgba(0, 0, 0, 0.6);
      --glass: rgba(18, 23, 33, 0.66);
      --glass-strong: rgba(24, 30, 42, 0.78);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.25);
      --glass-shadow: rgba(0, 0, 0, 0.45);
      --code-bg: rgba(255, 255, 255, 0.07);
      --ok: #4ade80; --ok-bg: rgba(74, 222, 128, .14);
      --pause: #fbbf24; --pause-bg: rgba(251, 191, 36, .14);
      --arch: #9aa3af; --arch-bg: rgba(154, 163, 175, .14);
      --blob-a: #312e81; --blob-b: #701a4d; --blob-c: #164e63; --blob-d: #4c1d95;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }

  /* ── 背景光斑:玻璃需要有东西可折射 ─────────────────────── */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; filter: blur(60px) saturate(130%); }
  .aurora i { position: absolute; border-radius: 50%; opacity: .75; animation: drift 26s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { width: 52vw; height: 52vw; left: 4vw;   top: -16vh; background: var(--blob-a); }
  .aurora i:nth-child(2) { width: 42vw; height: 42vw; left: 34vw;  top: 6vh;   background: var(--blob-b); animation-delay: -7s; }
  .aurora i:nth-child(3) { width: 48vw; height: 48vw; left: 10vw;  bottom: -20vh; background: var(--blob-c); animation-delay: -13s; }
  .aurora i:nth-child(4) { width: 34vw; height: 34vw; left: 46vw;  bottom: 8vh;  background: var(--blob-d); animation-delay: -19s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vw, 4vh) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } }

  /* ── 壁纸背景(替代 aurora,底部切换器选择) ─────────────── */
  .wallpaper { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; display: none; }
  .wallpaper::after { content: ""; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.22); }
  @media (prefers-color-scheme: dark) { .wallpaper::after { background: rgba(5, 8, 14, 0.48); } }
  html.has-wallpaper .wallpaper { display: block; }
  html.has-wallpaper .aurora { display: none; }
  .bg-picker { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .bg-picker button { width: 34px; height: 24px; border-radius: 7px; border: 2px solid transparent; cursor: pointer;
    background-size: cover; background-position: center; padding: 0; font-size: 11px; color: var(--muted); }
  .bg-picker button.aurora-thumb { background: linear-gradient(120deg, var(--blob-a), var(--blob-b), var(--blob-c)); }
  .bg-picker button.on { border-color: var(--accent); }

  /* ── 液态玻璃材质 ──────────────────────────────────────────
     基础:半透明底 + backdrop 模糊/增饱和 + 高光内描边 + 外投影。
     Chromium 下 JS 加 html.liquid,叠加 SVG feDisplacementMap 置换滤镜
     (backdrop-filter: url(#lens) …),Safari/Firefox 自动落回普通磨砂。 */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow:
      inset 0 1px 0 var(--glass-highlight),      /* 顶部受光高光 */
      inset 0 -1px 0 rgba(0, 0, 0, 0.06),        /* 底部收边 */
      0 10px 30px -12px var(--glass-shadow);      /* 悬浮投影 */
  }
  html.liquid .glass {
    -webkit-backdrop-filter: url(#lens) blur(20px) saturate(165%);
    backdrop-filter: url(#lens) blur(20px) saturate(165%);
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  header.bar { border-radius: 18px; padding: 16px 22px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 21px; }
  #domain { color: var(--muted); font-size: 13px; }
  /* 直接压在壁纸/光斑上的文字:光晕托底,保证任意背景可读 */
  .sub, .hint, h2, footer { text-shadow: var(--halo); }
  .sub { color: var(--muted); font-size: 13px; margin: 14px 4px 26px; }
  h2 { font-size: 17px; margin: 30px 4px 4px; display: flex; align-items: center; gap: 8px; }
  h2 .count { color: var(--muted); font-size: 13px; font-weight: 400; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 4px 14px; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filters button { color: var(--muted); border-radius: 999px; padding: 4px 14px; font-size: 13px; cursor: pointer;
    transition: transform .15s ease, color .15s ease; }
  .filters button:hover { transform: translateY(-1px); }
  .filters button.on { color: var(--accent); border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
    transition: transform .2s ease, box-shadow .2s ease; }
  .card:hover { transform: translateY(-3px);
    box-shadow: inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 rgba(0,0,0,.06),
      0 18px 42px -14px var(--glass-shadow); }
  .card .top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .card h3 { font-size: 16px; overflow-wrap: anywhere; }
  .badge { font-size: 12px; border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
  .badge.active      { color: var(--ok);    background: var(--ok-bg); }
  .badge.paused      { color: var(--pause); background: var(--pause-bg); }
  .badge.archived    { color: var(--arch);  background: var(--arch-bg); }
  .badge.interactive { color: var(--accent); background: var(--arch-bg); }
  .badge.service     { color: var(--ok);    background: var(--ok-bg); }
  .badge.scheduled   { color: var(--pause); background: var(--pause-bg); }
  .summary { font-size: 13.5px; color: var(--muted); flex: 1; }
  .entry { font: 12.5px/1.8 ui-monospace, "SF Mono", Menlo, monospace; background: var(--code-bg);
    border-radius: 8px; padding: 2px 10px; overflow-x: auto; white-space: nowrap; }
  .meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .meta a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .meta a:hover { text-decoration: underline; }
  .empty { color: var(--muted); border: 1px dashed var(--glass-border); border-radius: 18px;
    padding: 32px; text-align: center; font-size: 13.5px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; padding: 0 4px; }
</style>
</head>
<body>
<!-- 背景光斑层 / 壁纸层(二选一,底部切换) -->
<div class="aurora"><i></i><i></i><i></i><i></i></div>
<div class="wallpaper" id="wallpaper"></div>

<!-- 液态置换滤镜:feTurbulence 生成置换图(免外部 PNG),feDisplacementMap 扭曲背景。
     仅 Chromium 支持 SVG 滤镜作 backdrop-filter 输入,由 JS 探测后启用。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lens" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wrap">
  <header class="bar glass"><h1>🤖 agent 面板</h1><span id="domain"></span></header>
  <div class="sub">数据来自 <code>registry/</code> 登记簿 —— 项目与 agent 各一个文件一条,改文件即改面板。</div>

  <h2>📁 项目 <span class="count" id="p-count"></span></h2>
  <div class="hint">登记于 <code>registry/*.md</code>:简介 + git 路径 + 状态。</div>
  <div class="filters" id="p-filters"></div>
  <div class="grid" id="p-grid"></div>
  <div class="empty glass" id="p-empty" hidden>registry/ 里还没有登记项目 —— 拷贝 <code>registry/_example.md</code> 登记第一个。</div>

  <h2>🦾 agent <span class="count" id="a-count"></span></h2>
  <div class="hint">登记于 <code>registry/agents/*.md</code>:名字 + 类型 + 所在机器 + 入口。</div>
  <div class="grid" id="a-grid"></div>
  <div class="empty glass" id="a-empty" hidden>还没有登记 agent —— 拷贝 <code>registry/agents/_example.md</code> 登记第一个。</div>

  <footer>
    <span id="asof"></span>
    <div class="bg-picker" id="bg-picker" title="背景"></div>
  </footer>
</div>
<script>
// Chromium 才支持 SVG 滤镜进 backdrop-filter;其余浏览器保持普通磨砂玻璃
if (/Chrome\//.test(navigator.userAgent)) document.documentElement.classList.add('liquid')

const STATUS = { active: '运行中', paused: '暂停', archived: '已归档' }
const KIND = { interactive: '交互对话', service: '常驻服务', scheduled: '定时任务' }
let apps = [], agents = [], cur = 'all'

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const repoUrl = r => { const m = r.match(/^git@([^:]+):(.+?)(\.git)?$/); return m ? `https://${m[1]}/${m[2]}` : r }

function metaLine(p) {
  return `<div class="meta">
    ${p.runsOn ? `<span>📍 ${esc(p.runsOn)}</span>` : ''}
    ${p.repo ? `<a href="${esc(repoUrl(p.repo))}" target="_blank" rel="noopener">仓库</a>` : ''}
    ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">访问 ↗</a>` : ''}
  </div>`
}

function renderProjects() {
  const list = cur === 'all' ? apps : apps.filter(p => p.status === cur)
  document.getElementById('p-grid').innerHTML = list.map(p => `
    <div class="card glass">
      <div class="top"><h3>${esc(p.name)}</h3>
        <span class="badge ${esc(p.status)}">${STATUS[p.status] || esc(p.status)}</span></div>
      <div class="summary">${esc(p.summary) || '（暂无简介）'}</div>
      ${metaLine(p)}
    </div>`).join('')
  document.getElementById('p-empty').hidden = list.length > 0
  document.getElementById('p-count').textContent = apps.length || ''
  const counts = { all: apps.length }
  for (const p of apps) counts[p.status] = (counts[p.status] || 0) + 1
  document.getElementById('p-filters').innerHTML =
    [['all','全部'],['active','运行中'],['paused','暂停'],['archived','已归档']]
      .filter(([k]) => k === 'all' || counts[k])
      .map(([k, label]) => `<button class="glass ${cur===k?'on':''}" onclick="cur='${k}';renderProjects()">${label} ${counts[k]||0}</button>`).join('')
}

function renderAgents() {
  document.getElementById('a-grid').innerHTML = agents.map(a => `
    <div class="card glass">
      <div class="top"><h3>${esc(a.name)}</h3>
        <span class="badge ${esc(a.kind) || 'interactive'}">${KIND[a.kind] || esc(a.kind) || '—'}</span></div>
      <div class="summary">${esc(a.summary) || '（暂无简介）'}</div>
      ${a.entry ? `<div class="entry">${esc(a.entry)}</div>` : ''}
      ${metaLine(a)}
    </div>`).join('')
  document.getElementById('a-empty').hidden = agents.length > 0
  document.getElementById('a-count').textContent = agents.length || ''
}

// ── 背景切换:aurora 光斑或 wallpapers/ 壁纸;优先级 本地记忆 > config ──
const WALLS = ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg']
function setBg(name, save) {
  const wp = name && name !== 'aurora'
  document.documentElement.classList.toggle('has-wallpaper', wp)
  if (wp) document.getElementById('wallpaper').style.backgroundImage = `url(wallpapers/${name})`
  if (save) localStorage.setItem('panel-bg', name || 'aurora')
  document.querySelectorAll('.bg-picker button').forEach(b =>
    b.classList.toggle('on', (b.dataset.bg || 'aurora') === (name || 'aurora')))
}
function initBgPicker(cfgWall) {
  document.getElementById('bg-picker').innerHTML =
    `<button class="aurora-thumb" data-bg="aurora" onclick="setBg('aurora',1)" title="极光"></button>` +
    WALLS.map(w => `<button data-bg="${w}" style="background-image:url(wallpapers/${w})"
       onclick="setBg('${w}',1)" title="${w}"></button>`).join('')
  setBg(localStorage.getItem('panel-bg') || cfgWall || 'aurora')
}

Promise.all([
  fetch('/api/apps').then(r => r.json()),
  fetch('/api/agents').then(r => r.json()),
  fetch('/api/config').then(r => r.json()),
]).then(([p, a, cfg]) => {
  apps = p.data; agents = a.data
  renderProjects(); renderAgents()
  document.getElementById('asof').textContent = `数据截至 ${new Date(p.asOf).toLocaleString()}`
  if (cfg.data.DOMAIN) document.getElementById('domain').textContent = cfg.data.DOMAIN
  initBgPicker(cfg.data.WALLPAPER)
})
</script>
</body>
</html>
