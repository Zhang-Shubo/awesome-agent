<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent 项目面板</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6b7280;
    --border: #e5e7eb; --accent: #4f46e5;
    --ok: #16a34a; --ok-bg: #f0fdf4; --pause: #d97706; --pause-bg: #fffbeb;
    --arch: #6b7280; --arch-bg: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --card: #181c22; --text: #e7eaee; --muted: #9aa3af;
      --border: #2a3038; --accent: #818cf8;
      --ok: #4ade80; --ok-bg: #12291a; --pause: #fbbf24; --pause-bg: #2b2110;
      --arch: #9aa3af; --arch-bg: #22262c;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 22px; }
  #domain { color: var(--muted); font-size: 13px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .filters { display: flex; gap: 8px; margin-bottom: 20px; }
  .filters button { border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 4px 14px; font-size: 13px; cursor: pointer; }
  .filters button.on { border-color: var(--accent); color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 8px; }
  .card .top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .card h2 { font-size: 16px; overflow-wrap: anywhere; }
  .badge { font-size: 12px; border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
  .badge.active   { color: var(--ok);    background: var(--ok-bg); }
  .badge.paused   { color: var(--pause); background: var(--pause-bg); }
  .badge.archived { color: var(--arch);  background: var(--arch-bg); }
  .summary { font-size: 13.5px; color: var(--muted); flex: 1; }
  .meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .meta a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .meta a:hover { text-decoration: underline; }
  .empty { color: var(--muted); border: 1px dashed var(--border); border-radius: 12px;
    padding: 40px; text-align: center; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🤖 agent 项目面板</h1><span id="domain"></span></header>
  <div class="sub">数据来自 <code>registry/</code> 登记簿 —— 一个项目一个文件,只登记简介与 git 路径。</div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>registry/ 里还没有登记任何项目。<br>拷贝 <code>registry/_example.md</code> 登记你的第一个项目。</div>
  <footer id="asof"></footer>
</div>
<script>
const STATUS = { active: '运行中', paused: '暂停', archived: '已归档' }
let all = [], cur = 'all'

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function render() {
  const list = cur === 'all' ? all : all.filter(p => p.status === cur)
  const grid = document.getElementById('grid')
  grid.innerHTML = list.map(p => `
    <div class="card">
      <div class="top"><h2>${esc(p.name)}</h2>
        <span class="badge ${esc(p.status)}">${STATUS[p.status] || esc(p.status)}</span></div>
      <div class="summary">${esc(p.summary) || '（暂无简介）'}</div>
      <div class="meta">
        ${p.runsOn ? `<span>📍 ${esc(p.runsOn)}</span>` : ''}
        ${p.repo ? `<a href="${esc(repoUrl(p.repo))}" target="_blank" rel="noopener">仓库</a>` : ''}
        ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">访问 ↗</a>` : ''}
      </div>
    </div>`).join('')
  document.getElementById('empty').hidden = list.length > 0
  const counts = { all: all.length }
  for (const p of all) counts[p.status] = (counts[p.status] || 0) + 1
  document.getElementById('filters').innerHTML =
    [['all','全部'],['active','运行中'],['paused','暂停'],['archived','已归档']]
      .filter(([k]) => k === 'all' || counts[k])
      .map(([k, label]) => `<button class="${cur===k?'on':''}" onclick="cur='${k}';render()">${label} ${counts[k]||0}</button>`).join('')
}

function repoUrl(r) {
  const m = r.match(/^git@([^:]+):(.+?)(\.git)?$/)
  return m ? `https://${m[1]}/${m[2]}` : r
}

fetch('/api/projects').then(r => r.json()).then(({ data, asOf }) => {
  all = data; render()
  document.getElementById('asof').textContent = `数据截至 ${new Date(asOf).toLocaleString()}`
})
fetch('/api/config').then(r => r.json()).then(({ data }) => {
  if (data.DOMAIN) document.getElementById('domain').textContent = data.DOMAIN
})
</script>
</body>
</html>
